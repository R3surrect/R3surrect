name: htb_generate_data

on:
  schedule:
    - cron: '0 06-22 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/htb-activity.mjs
      - run: |
          git pull origin master
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add htb-activity.json htb-activity.svg
          git diff --staged --quiet || git commit -m "chore(htb): update activity heatmap"
          git push
