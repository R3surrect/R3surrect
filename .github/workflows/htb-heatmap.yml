name: regenerate_htb_heatmap

on:
  schedule:
    - cron: '0 16-23 * * *'
  workflow_dispatch:

jobs:
  update-heatmap:
    runs-on: ubuntu-latest
    steps:
      - name: checkout_repo
        uses: actions/checkout@v3

      - name: python_setup
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: generate_heatmap
        env:
          HTB_TOKEN: ${{ secrets.HTB_TOKEN }}
        run: |
          python << 'EOF'
          import os, requests, datetime
          
          token = os.environ.get("HTB_TOKEN")
          headers = {"Authorization": f"Bearer {token}"}
          
          EOF
          
      - name: Commit and Push SVG
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add assets/htb_heatmap.svg || true
          git commit -m "update_htb_heatmap" || true
          git push || true
